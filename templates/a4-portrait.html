<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Poster · A4 編輯風</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  /* 編輯風：沙色標題帶 + 暖米內容區，雙欄重點以頂線分組 */
  :root {
    --bg: #F4EFE7;
    --sand: #E8DBCD;      /* 標題帶 */
    --ink: #2A2620;
    --ink-soft: #5A524A;
    --line: #BFB2A2;
    --accent: #8B4532;
    --serif: 'Noto Serif TC', 'Noto Serif CJK TC', 'Source Han Serif TC', serif;
    --sans: 'Noto Sans TC', 'Noto Sans CJK TC', 'Source Han Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  @page { size: A4 portrait; margin: 0; }

  body {
    background: #E6DFD3;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: var(--sans);
    color: var(--ink);
    line-break: strict;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    width: min(780px, calc(100vw - 32px), calc((100dvh - 48px) * 210 / 297));
    aspect-ratio: 210 / 297;
    background: var(--bg);
    box-shadow: 0 20px 60px rgba(42, 38, 32, 0.12);
    display: grid;
    grid-template-rows: auto 1fr;
    container-type: inline-size;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .poster { width: 100%; box-shadow: none; aspect-ratio: auto; height: 100vh; }
  }

  /* 原尺寸 780 寬，1cqw = 7.8px */

  /* ============ 標題帶 ============ */
  .head {
    background: var(--sand);
    padding: 7.4cqw 7.4cqw 5.4cqw;
  }
  .deco-line {
    width: 4.8cqw;
    height: 0.2cqw;
    background: var(--accent);
    margin-bottom: 3.6cqw;
  }
  .title { font-family: var(--serif); color: var(--ink); line-height: 1.25; letter-spacing: 0.01em; }
  .title-light { display: block; font-size: 6.3cqw; font-weight: 400; }
  .title-bold  { display: block; font-size: 6.3cqw; font-weight: 900; }
  .subtitle {
    margin-top: 2.6cqw;
    font-size: 2.1cqw;
    line-height: 1.5;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  /* ============ 雙欄重點 ============ */
  .points {
    padding: 9.6cqw 7.4cqw 6cqw;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    column-gap: 5cqw;
    align-content: start;
    max-height: 100%;
  }
  .point {
    border-top: 1px solid var(--line);
    padding-top: 3.6cqw;
    padding-bottom: 6cqw;
  }
  .point-head {
    font-family: var(--serif);
    font-size: 3.7cqw;
    font-weight: 900;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 2.6cqw;
  }
  .point-desc {
    font-size: 2.6cqw;
    line-height: 1.65;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <main class="poster">
    <section class="head">
      <div class="deco-line"></div>
      <h1 class="title">
        <span class="title-light">讓貼文更好讀的</span>
        <span class="title-bold">六個設計原則</span>
      </h1>
      <p class="subtitle">發文前，快速檢查主張、字體、留白、配色、層級與收尾。</p>
    </section>

    <!-- A4 建議 4 或 6 點（兩欄），每點正文兩行 -->
    <section class="points">
      <div class="point">
        <h2 class="point-head">先定主張</h2>
        <p class="point-desc">先決定讀者要記住什麼，<br>再挑圖片和構圖。</p>
      </div>
      <div class="point">
        <h2 class="point-head">簡化字體</h2>
        <p class="point-desc">用一至兩種字體，<br>讓標題和正文容易區分。</p>
      </div>
      <div class="point">
        <h2 class="point-head">用留白分組</h2>
        <p class="point-desc">相關資訊排近一點，<br>讓不同重點之間有空間。</p>
      </div>
      <div class="point">
        <h2 class="point-head">把配色收斂到三色</h2>
        <p class="point-desc">先定主色、輔色與強調色，<br>把強調色留給關鍵資訊。</p>
      </div>
      <div class="point">
        <h2 class="point-head">做出閱讀層級</h2>
        <p class="point-desc">用字級、字重與位置，<br>讓讀者知道要先看哪裡。</p>
      </div>
      <div class="point">
        <h2 class="point-head">收尾留一個重點</h2>
        <p class="point-desc">署名、日期或下一步，<br>留下讀者還需要的資訊。</p>
      </div>
    </section>
  </main>
</body>
</html>
