<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#352b22;line-break:strict;font-family:"Noto Serif CJK TC",Georgia,serif}
main{width:940px;padding:20px;display:grid;gap:18px}.card{position:relative;width:900px;height:540px;overflow:hidden;border-radius:19px;background:linear-gradient(126deg,#f8f2e9,#eae0d4 68%,#e0d1bf);box-shadow:0 3px 12px #4837271c}
.card::after{content:"";position:absolute;inset:0;border:1px solid #a48a711f;border-radius:inherit;pointer-events:none}
.photo{position:absolute;inset:0 auto 0 0;width:46%;height:100%;object-fit:cover;object-position:center 60%;mask-image:linear-gradient(90deg,#000 0 69%,transparent 100%)}
.paper-arc{position:absolute;inset:auto -23% -112% auto;width:83%;aspect-ratio:1;border-radius:50%;background:#bda78e4f;border:1px solid #fffcf3b0;box-shadow:0 0 0 26px #fff9ee38}
.front .text{position:absolute;inset:67px 64px 48px 41%;display:flex;flex-direction:column;align-items:flex-start}
.brand{font:48px Georgia,serif;letter-spacing:.09em;white-space:nowrap}
.brand-zh{font-size:24px;letter-spacing:.29em}.studio{font:13px "Noto Sans CJK TC",sans-serif;letter-spacing:.24em;margin-top:8px;color:#655244}
.divider{height:1px;width:100%;background:linear-gradient(90deg,#a69078,#a6907829);margin:29px 0 23px}
h1,h2,p{margin:0}h1{font-weight:500;font-size:42px;letter-spacing:.11em}h1 span{font:22px Georgia,serif;letter-spacing:0;margin-left:8px}
.role{font-size:18px;line-height:1.7;margin-top:7px}.tag{font:italic 23px Georgia,serif;margin-top:auto;color:#604c3b}
.back{padding:53px 55px}.back .paper-arc{inset:auto -12% -112% auto;width:88%}.back .paper-arc::before{content:"";position:absolute;inset:26px;border:1px solid #faf0e1a0;border-radius:50%}
.back-content{position:relative;display:grid;grid-template-columns:1fr 207px;gap:26px;height:100%}
h2{font-size:29px;font-weight:500;letter-spacing:.12em;display:flex;align-items:center;gap:15px}h2::after{content:"";height:1px;background:#ad9680;flex:1}
.services{display:grid;grid-template-columns:1fr 1fr;gap:17px 14px;margin-top:27px}
.services div{display:grid;grid-template-columns:39px 1fr;column-gap:10px;align-items:center;padding:0 0 14px;border-bottom:1px solid #b09a824f}
.services svg{grid-row:span 2;width:35px;fill:none;stroke:#806b52;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.services b{font-size:21px;font-weight:500}.services small{font:16px Georgia,serif;color:#675443}
.contact{margin-top:34px;font:21px/1.65 Georgia,serif}
.aside{border-left:1px solid #ae957a;padding:42px 0 14px 26px;display:flex;flex-direction:column;justify-content:space-between}
.aside span{font:italic 53px Georgia,serif;color:#7a5f47}.aside p{font-size:17px;line-height:1.7;letter-spacing:.1em}
</style><style>
body{width:1076px;height:720px}
main{width:1076px;height:720px;display:grid;grid-template-rows:355px 336px;gap:10px;padding:2px 5px 17px}
.card{width:1066px;height:100%;border-radius:27px}

.front .text{inset:34px 88px 23px 42%}.brand{font-size:43px}.brand-zh{font-size:23px}.studio{margin-top:3px}
.divider{margin:13px 0 10px}h1{font-size:35px}.role{font-size:16px;margin-top:3px}.tag{font-size:20px}
.back{padding:25px 50px}.back-content{grid-template-columns:1fr 250px}
.services{grid-template-columns:repeat(4,1fr);margin-top:18px;gap:14px}
.services div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-bottom:10px}
.services svg{width:31px;margin-bottom:3px}.services b{font-size:19px;white-space:nowrap}
.contact{margin-top:17px;font-size:19px}.aside{padding:19px 0 6px 28px}.aside span{font-size:48px}
</style><style>
main .complete-back{display:block;padding:23px 28px}
.complete-back .info-layout{position:relative;display:grid;grid-template-columns:60% 40%;height:100%}
.complete-back h2{display:flex;align-items:center;gap:16px;margin:0;font:500 25px "Noto Serif CJK TC",serif;letter-spacing:.12em}
.complete-back h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.info-left{padding-right:20px}
.service-grid{display:grid;grid-template-columns:repeat(4,1fr);margin:15px 0 16px}
.service{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;text-align:center;border-right:1px solid var(--rule);padding:0 3px;min-height:117px}
.service:last-child{border:0}.service svg{width:36px;height:36px;color:var(--accent);margin:0 0 4px;stroke-width:1.25}
.service b{font:500 17px/1.18 "Noto Serif CJK TC",serif}.service small{font:16px/1.1 Georgia,serif}
.info-contact{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:5px}
.info-contact div{display:flex;align-items:center;gap:10px;font-size:19px}
.info-contact svg{width:20px;height:20px;color:var(--accent)}
.info-right{border-left:1px solid var(--rule);padding:8px 7px 5px 25px;display:flex;flex-direction:column;justify-content:space-between}
.links{display:flex;align-items:flex-start;gap:16px}.links figure{margin:0;text-align:center}.links img{display:block;width:122px;height:122px;image-rendering:pixelated}
.links figcaption{font:13px "Noto Sans CJK TC",sans-serif;margin-top:4px}
.links ul{list-style:none;padding:2px 0 0;margin:0;display:grid;gap:10px}
.links li{display:flex;align-items:center;gap:9px;font:16px "Noto Sans CJK TC",sans-serif;white-space:nowrap}
.links svg{width:23px;height:23px;fill:currentColor}.links .social-red svg{fill:#c83e44}
.signature{text-align:right;font:22px Georgia,serif;letter-spacing:.12em}
.signature small{display:block;margin-top:5px;font:14px "Noto Serif CJK TC",serif;letter-spacing:.20em}
.complete-back{--rule:#aa9782;--accent:#77614d}</style><main>
